Die betroffene Zone waechst schneller als unsere urspruenglich berechnete Sicherheitsdistanz
Mehrere unabhaengige Messreihen zeigen das sich das Ereignis noch weiter verstaerkt
Die Stoerung ist inzwischen deutlich groesser als der beim ersten Alarm erfasste Bereich
Unsere Modelle kommen zu dem wenig beruhigenden Ergebnis das der aktuelle Standort in der weiteren Ausbreitungsrichtung liegt
Die Intensitaet steigt mit jedem neuen Messzyklus und ein baldiges Abklingen ist nicht erkennbar
Der sichere Zeitraum fuer weitere Oberflaechenmessungen wird von der Prognose laufend nach unten korrigiert
Die Ausbreitung verlaeuft nicht gleichmaessig aber eindeutig in Richtung unserer Landezone
Die zweite Berechnung bewertet das Ereignis eine Gefahrenstufe hoeher als noch wenige Sekunden zuvor
Der Prozess erfasst inzwischen mehrere Messpunkte gleichzeitig und ist damit kein rein lokaler Effekt mehr
Die Sensoren koennen den Rand der Stoerung noch bestimmen, ihre weitere Entwicklung aber nicht verlaesslich vorhersagen
Die Energie des Vorgangs liegt inzwischen deutlich ueber den Werten des ersten Scans
Eine Kontrollmessung bestaetigt das sich die verfuegbare Sicherheitsreserve weiter verkleinert
Das Ereignis bleibt natuerlichen Ursprungs entwickelt sich aber fuer unseren Aufenthalt ausgesprochen unpraktisch
Die Gefahrenprojektion zeigt inzwischen mehrere moegliche Auswirkungen auf Schiff und Landeplatz
