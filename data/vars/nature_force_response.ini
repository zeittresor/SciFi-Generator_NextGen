Ich verlagere Energie auf Triebwerke und Lageregelung und reduziere alle nicht notwendigen Oberflaechenfunktionen
Die Bodenverbindungen werden geloest und das Schiff fuer einen sofortigen Start vorbereitet
Wir ziehen externe Sensorarme und Probennehmer ein bevor weitere Systeme unnoetig gefaehrdet werden
Die Triebwerke laufen vor und die Startautomatik uebernimmt die Kontrolle ueber alle notwendigen Rueckflugfunktionen
Ich markiere die Messdaten als ausreichend. Wissenschaftlicher Erkenntnisgewinn ist gut, ein beschaedigtes Schattel eher weniger
Alle Aussenteams und Sonden werden soweit moeglich zurueckgerufen und die Aussenluken verriegelt
Wir brechen die aktive Beobachtung ab und wechseln von Forschungsbetrieb auf Rueckstart
Die Navigationsloesung fuer den direkten Aufstieg wird geladen und gegen die aktuellen Umweltdaten geprueft
Alle nicht benoetigten Experimente werden beendet damit die volle Energiereserve fuer den Start verfuegbar ist
Die Sicherheitsautomatik beendet den Bodenbetrieb und gibt die Triebwerkssektion fuer den sofortigen Einsatz frei
Wir sichern nur noch die bereits gewonnenen Daten und verzichten auf weitere Proben
Der Bordcomputer setzt die Mission auf Rueckzug und ordnet alle Systeme dem Startvorgang unter
Ich schliesse die laufenden Messungen kontrolliert ab und lasse die Startsequenz vorbereiten
Die Aussenmodule werden verriegelt. Alles Weitere koennen wir uns sehr gut aus dem Orbit ansehen
