Vor uns bildet sich eine mehrere kilometer breite Staubwand mit elektrisch geladenen Partikeln
Aus mehreren Bodenspalten tritt ueberhitztes Gas aus und erzeugt eine Kette kleiner Eruptionen
Eine Serie starker Bodenwellen laeuft wie eine langsame Brandung durch das gesamte Tal
Die Temperatur faellt innerhalb kurzer Zeit so stark ab das freiliegende Fluessigkeiten schlagartig kristallisieren
Ein extrem dichter Niederschlag aus mineralischen Partikeln beginnt die Umgebung wie harter Hagel zu treffen
Der Luftdruck steigt unregelmaessig an und erzeugt kurze aber sehr heftige Druckstoesse
Ein naher Hang beginnt sich auf breiter Front zu bewegen und schiebt grosse Gesteinsmassen in Richtung Landezone
Ueber dem Landeplatz entsteht ein schnell rotierender Wirbel der Staub und kleinere Gesteinsbrocken mitreisst
Eine unterirdische Waermequelle oeffnet mehrere gluehende Risse im Boden und laesst die Oberflaeche aufbrechen
Eine starke elektrostatische Front wandert ueber die Ebene und entlaedt sich fortlaufend zwischen Boden und Atmos phaere
Ein ploetzlicher Temperaturanstieg erhitzt die oberste Bodenschicht innerhalb weniger Minuten auf kritische Werte
Mehrere zuvor feste Eisfelder brechen gleichzeitig auf und beginnen sich gegeneinander zu verschieben
Eine Serie lokaler Schwerkraftschwankungen hebt lose Gesteinsmassen kurz an und laesst sie wieder auf den Boden schlagen
Dichter kryogener Nebel stroemt aus tieferen Senken ueber den Landeplatz und laesst die Temperatur weiter absinken
