Das Schattel geht wieder auf freien Kurs und verlaesst den Bereich der Notrufquelle
Wir vergroessern den Abstand und kehren in einen sicheren Navigationskorridor zurueck
Die Rettungssonden sind wieder an Bord und das Schiff nimmt Kurs in den freien Systemraum
Nach Abschluss der Dokumentation loesen wir uns aus der lokalen Driftbahn und beschleunigen auf Sicherheitsabstand
Die Quelle bleibt hinter uns waehrend das Schattel eine freie Position fuer den naechsten Sprung anfliegt
Wir verlassen den Nahbereich kontrolliert und stellen die normale Navigation wieder her
Das Schiff befindet sich wieder ausserhalb aller Truemmer-, Andock- und Gefahrenzonen
