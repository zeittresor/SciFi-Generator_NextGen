Mehrere Aussensensoren arbeiten nur noch eingeschraenkt und werden vorsorglich eingefahren
Die Lageregelung muss fortlaufend korrigieren um das Schattel in sicherer Startausrichtung zu halten
Das Bordnetz schaltet mehrere nicht notwendige Verbraucher ab und reserviert Energie fuer Triebwerke und Schutzsysteme
Ein Teil der aeusseren Sensorik meldet Belastungswerte nahe der vorgesehenen Sicherheitsgrenze
Die automatische Startkontrolle fordert eine erneute Pruefung aller Landebeine und Triebwerkssektionen an
Mehrere Wartungssysteme wechseln auf Schutzbetrieb und verriegeln ihre aeusseren Abdeckungen
Die Kuehl- und Energiesysteme benoetigen inzwischen deutlich mehr Reserve als fuer einen normalen Aufenthalt vorgesehen
Die Navigationsplattform haelt den Startvektor nur noch mit haeufigen Korrekturen stabil
Zwei externe Messmodule werden abgeschaltet bevor ihre Grenzwerte ueberschritten werden
Der Bordcomputer stuft weitere Beschaedigungen als vermeidbar ein und empfiehlt den sofortigen Rueckstart
Die Schiffssysteme sind noch funktionsfaehig, der vorhandene Sicherheitsspielraum nimmt jedoch sichtbar ab
Einige Aussenkomponenten melden kurzzeitige Aussetzer und werden aus dem primaeren Steuerkreis genommen
Die Schutzautomatik priorisiert nun Huelle, Energieversorgung und Manoevriertriebwerke
Noch ist kein kritischer Schaden entstanden. Ich wuerde diesen Zustand ausnahmsweise gern beibehalten
