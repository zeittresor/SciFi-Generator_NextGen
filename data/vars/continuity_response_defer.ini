Die Crew markiert die Spur fuer eine spaetere Untersuchung und setzt die aktuelle Mission zunaechst fort
Der Fund wird mit hoher Prioritaet archiviert ohne den laufenden Einsatz unmittelbar zu unterbrechen
Die bekannte Signatur wird als offener Punkt im Missionslog festgehalten und vorerst nicht weiter verfolgt
Navigation und Sensorik speichern eine genaue Referenz damit ein spaeterer Sprung gezielt darauf reagieren kann
Die Expedition entscheidet dass die neue Spur wichtig aber fuer den aktuellen Einsatz nicht dringlich genug ist
Das Bordteam verschiebt die aktive Untersuchung und laesst den Handlungsfaden bewusst offen
Der Fund wird nicht verworfen sondern als moegliches Ziel fuer eine spaetere Mission gesichert
Die Crew setzt einen Wiedervorlagehinweis und konzentriert sich wieder auf den aktuellen Sektor
