Die ersten Auswirkungen erreichen das Schattel und lassen mehrere Aussensensoren gleichzeitig in den Schutzmodus wechseln
Die Sicherheitsautomatik verkuerzt das verbleibende Zeitfenster fuer einen normalen Rueckstart
Mehrere externe Messpunkte fallen aus oder liefern nur noch stark schwankende Werte
Die Bedingungen am Landeplatz verschlechtern sich nun schneller als die laufende Prognose nachgefuehrt werden kann
Eine weitere Intensitaetsstufe wird erreicht und die automatische Startbereitschaft aktiviert sich vorsorglich
Die Sicht- und Sensordaten werden zunehmend unzuverlaessig obwohl die internen Schiffssysteme noch stabil arbeiten
Das Ereignis erreicht nun auch die unmittelbare Sicherheitszone um das Schiff
Mehrere Schutzsysteme reagieren gleichzeitig und schliessen nicht benoetigte Aussenmodule
Die Reserven fuer einen laengeren Aufenthalt sinken schneller als vorgesehen
Der naechste Messzyklus bestaetigt das die Situation nicht mehr als harmlose lokale Besonderheit behandelt werden kann
Die Belastungsanzeigen steigen in mehreren voneinander unabhaengigen Systemen gleichzeitig an
Die automatische Missionsbewertung setzt den weiteren Forschungsbetrieb auf nicht empfohlen
Die Sicherheitsgrenze wird an mehreren Messpunkten gleichzeitig erreicht
Weitere passive Beobachtung bleibt moeglich, ein Verbleib am Boden wird jedoch zunehmend unvernünftig
