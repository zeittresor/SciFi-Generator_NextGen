Die Messung laesst sich nicht reproduzieren und wir behalten deshalb den sicheren freien Kurs bei
Nach mehreren Kontrollzyklen bleiben alle Werte stabil und die Anomalie wird nur im Logbuch vermerkt
Ich lasse die Sprungberechnung erst nach einer vollstaendigen Referenzmessung wieder freigeben
Das Schiff entfernt sich einige tausend Kilometer von der Position ohne dass der Effekt erneut auftritt
Die Navigationsplattform wird neu kalibriert und bestaetigt danach eine normale freie Raumlage
Der kurze Effekt bleibt ungeklaert aber beeinflusst keine der fuer den Sprung notwendigen Systeme
Wir markieren die Koordinaten und setzen den Missionsabschluss fort nachdem alle Sensoren wieder normale Werte zeigen
