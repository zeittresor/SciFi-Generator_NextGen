Untersuche Umgebung.
Taste Umgebung ab.
Scanne den Bereich.
Erfasse Umgebung.
Umgebungsscan laeuft.
Untersuche Landegebiet.
Erkunde naehere Umgebung.
Landegebiet wird abgetastet.
Rasterscan der Landmasse wird durchgefuehrt.
Perrimeter messung wird ausgefuehrt.
Erfassbarer Radius wird gescannt.
Analysiere unmittelbaren Landeumkreis.
Starte dreidimensionale Umgebungs kartierung.
Erfasse chemische und biologische Spuren.
Fuehre einen vollstaendigen Nahbereichs Scan durch.
Pruefe das Gelaende auf Bewegungen.
Kartiere alle Objekte innerhalb des Sicherheitsradius.
Vergleiche die Umgebung mit den Orbitalaufnahmen.
