Es hat uns entdeckt,
Es hat uns gesichtet,
Es ist sehr nahe gekommen,
Das Lebewesen scheint nicht gluecklich ueber unsere anwesenheit zu sein,
Die Lebensform ist auf uns aufmerksam geworden,
Das Vieh hat uns bemerkt,
Das Etwas hat uns offenbar gesehen,
Scheinbar wurden wir von dem Etwas gesehen,
Scheinbar hat es erkannt das wir es gesehen haben,
Das Etwas hat wohl erkannt das wir es beobachten, 
Die Kreatur hat unsere Position lokalisiert,
Das fremde Wesen reagiert nun eindeutig auf uns,
Offenbar sind wir nicht mehr unbemerkt,
Die Lebensform richtet ihre Aufmerksamkeit auf das Schiff,
Das Objekt scheint uns als lebendig erkannt zu haben,
Das Wesen hat die Bewegung unserer Sensoren bemerkt,
Die Kreatur wendet sich nun direkt in unsere Richtung,
