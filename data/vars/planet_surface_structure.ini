von Graeben durchzogen
von Fluessen gepraegt
mit Seen bedeckt
von Schluchten durchzogen
loecherig und von vielen Hoehlen durchzogen
untypisch, kuenstlich strukturiert
mit Duenen ueberzogen
mit Kratern uebersaet 
vergleichbar mit der Uhr Erde zu ihrer Entstehung 
von einkaerbungen gezeichnet 
von steilen erhebungen gepraegt
von spitz zackigen Bergen uebersaet 
vergleichbar mit der venus oberflaeche im aktu ellen stadium 
vergleichbar mit der Mars oberflaeche vor dessen Kolonisierung im letzten Jahr tausend
von gewaltigen Salzebenen unterbrochen
mit kristallinen Saeulen bedeckt
von tiefen parallelen Rinnen durchzogen
durch riesige Felsboegen gepraegt
mit kuenstlich wirkenden Terrassen versehen
von dunklen Lavafeldern ueberzogen
von schwimmenden Gesteinsinseln umgeben
von tiefen Risssystemen durchzogen
mit breiten glatten Ebenen bedeckt
von langen mineralischen Ruecken unterbrochen
in grosse polygonale Platten zerlegt
von zahlreichen kleinen Einschlagkratern gepraegt
mit wellenartigen Gesteinsformationen ueberzogen
durch breite ausgetrocknete Flussbetten gegliedert
