Der genaue Vergleich zeigt dass die Aehnlichkeit zufaellig war und keine belastbare Verbindung zum alten Ereignis besteht
Die vermeintlich bekannte Signatur zerfaellt bei hoeherer Aufloesung in ein voellig anderes lokales Muster
Nach mehreren Kontrollmessungen bleibt nur eine statistische Uebereinstimmung ohne gemeinsamen Ursprung
Die Untersuchung widerlegt den vermuteten Zusammenhang und verhindert damit eine unnoetige weitere Verfolgung
Eine zunaechst ueberzeugende Parallele erweist sich als Folge aehnlicher Umweltbedingungen statt derselben Ursache
Die Borddatenbank korrigiert ihre erste Einstufung nachdem zusaetzliche Messwerte einen anderen Ursprung zeigen
Die Spur kann von dem frueheren Vorgang getrennt werden und wird nur noch als lokale Besonderheit archiviert
Die neue Beobachtung sieht dem alten Ereignis zwar erstaunlich aehnlich besitzt aber eine eindeutig andere Ursache
