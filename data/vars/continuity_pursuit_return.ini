Ein kleiner Kontakt mit bekannter Bewegungscharakteristik erscheint erneut am Rand der Sensorreichweite
Die passive Ortung entdeckt dieselbe schwer einzuordnende Signatur die dem Schiff bereits in einem frueheren System gefolgt war
Hinter dem Schiff bildet sich fuer wenige Sekunden ein Kontaktmuster das mit einem archivierten Verfolger uebereinstimmt
Eine zuvor verschwundene fremde Spur kehrt zurueck und haelt erneut auffaellig konstanten Abstand
Die Sensoren melden einen Beobachter dessen Beschleunigungsprofil aus einem frueheren Missionslog bekannt ist
Ein scheinbar zufaelliger Kontakt wiederholt exakt jene Kurskorrekturen die bereits bei einer frueheren Verfolgung aufgefallen waren
Am aeusseren Rand des Systems erscheint eine Signatur die schon einmal nach einem Einsatz hinter dem Schiff geblieben war
Eine vertraute aber weiterhin unidentifizierte Ortungsspur taucht nach mehreren Spruengen erneut auf
