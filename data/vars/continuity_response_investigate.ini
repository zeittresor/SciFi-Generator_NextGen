Die Crew entscheidet sich die wiederkehrende Spur diesmal gezielt weiterzuverfolgen
Statt den Fund erneut nur zu protokollieren wird ein begrenztes Untersuchungsfenster freigegeben
Navigation und Sensorik werden auf eine kontrollierte Annaeherung an die bekannte Signatur abgestimmt
Die Expedition behandelt den Rueckbezug als moeglichen zusammenhaengenden Handlungsfaden und untersucht ihn aktiv
Das Bordteam priorisiert einen Vergleich mit den alten Missionsdaten und geht der Spur systematisch nach
Die bekannte Signatur wird zum primaeren Nebenziel erklaert solange die sichere Rueckkehr nicht gefaehrdet wird
Die Sensorplattformen konzentrieren sich fuer kurze Zeit vollstaendig auf die wiederkehrende Beobachtung
Die Crew nutzt die frueheren Messdaten als Referenz und versucht diesmal einen belastbaren Zusammenhang nachzuweisen
