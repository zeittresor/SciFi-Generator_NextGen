Alle Sensoraufzeichnungen des Raumkontaktes werden redundant gespeichert
Die Koordinaten und beobachteten Gefahren werden im Navigationsarchiv markiert
Eine automatische Warnnotiz fuer spaetere Schiffe wird vorbereitet
Die Messdaten werden nach Zeit, Position und Sensorquelle sortiert
Der untersuchte Bereich wird mit einem vorlaeufigen Risikostatus im Systemkatalog erfasst
Alle Sonden und Telemetriedaten werden mit dem Missionslog synchronisiert
Ich archiviere die Ereignisse unter Dinge die wir gesehen haben ohne sie unbedingt noch einmal sehen zu muessen
Die aufgezeichneten Messreihen werden mit Position und Zeitstempel im Missionsarchiv gesichert
Der Ereignisort wird fuer spaetere Expeditionen mit den heute ermittelten Gefahrenhinweisen katalogisiert
Alle passiven und aktiven Scans werden zusammengefuehrt und als abgeschlossener Datensatz gespeichert
Die Navigation uebernimmt die relevanten Koordinaten in die lokale Gefahrenkarte
Ich sichere den Bericht und vermerke ausdruecklich dass eine erneute Annaeherung nicht automatisch empfohlen wird
Die Telemetrie wird auf Vollstaendigkeit geprueft und anschliessend dem Missionsprotokoll angehaengt
Die letzten Sensordaten werden archiviert; fuer den naechsten Sprung sind keine weiteren Messungen erforderlich
