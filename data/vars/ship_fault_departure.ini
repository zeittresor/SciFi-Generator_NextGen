Wir verlassen die Diagnoseposition und gehen auf einen freien Kurs fern von allen groesseren Himmelskoerpern
Das Schattel beschleunigt vorsichtig in einen ungestoerten Bereich des Systems
Nach Abschluss der Reparatur wird eine sichere freie Position fuer den naechsten Sprung angeflogen
Die normale Navigation uebernimmt wieder und fuehrt das Schiff aus dem Nahbereich lokaler Gefahren
Wir stellen den regulaeren Flugzustand her und halten Abstand zu allen bekannten Objekten
Das Schiff befindet sich wieder im freien Raum und alle Reparaturdaten werden im Logbuch gesichert
Die Wartung ist beendet und das Schattel nimmt eine stabile sprunggeeignete Position ein
