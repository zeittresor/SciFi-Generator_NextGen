Wir antworten nicht aktiv und behalten den gewonnenen Sicherheitsabstand bei
Das Signal wird archiviert; fuer eine erneute Untersuchung reicht die aktuelle Informationslage nicht aus
Die spaete Meldung aendert nichts an unserer Entscheidung das System von einer sicheren Position aus zu verlassen
