Gerade als wir den eigentlichen Einsatz abschliessen erreicht uns noch ein verzoegertes schwaches Signal vom zurueckliegenden Gebiet
Kurz vor dem Sprungfenster erscheint eine spaete Antwort auf eine unserer frueheren passiven Anfragen
Beim Verlassen des Einsatzbereichs registriert die Funkanlage ein einzelnes neues Datenpaket
Ein zuvor stiller Sender meldet sich erst nachdem wir bereits deutlichen Abstand gewonnen haben
Waehren der Abschlussdiagnose trifft eine kurze schmalbandige Nachricht aus Richtung des Einsatzortes ein
Ein Relais im System wiederholt unerwartet eine Kennung die zu unserem gerade beendeten Einsatz passt
Noch bevor wir die Sprungberechnung starten kann ein letzter schwacher Funkimpuls dem alten Ziel zugeordnet werden
