Die Crew behaelt deutlichen Abstand und beschraenkt sich zunaechst auf passive Beobachtung
Die bekannte Spur wird ernst genommen ohne den aktuellen Missionskurs sofort zu verlassen
Sensoren zeichnen alle Daten auf waehrend das Schiff eine sichere Position beibehält
Die Expedition reagiert vorsichtig und versucht moeglichst wenig eigene Aktivitaet preiszugeben
Die Signatur bleibt unter Beobachtung waehrend Navigation und Sprungantrieb einsatzbereit gehalten werden
Statt einer direkten Annaeherung werden nur passive Messungen und Langstreckenaufnahmen angefertigt
Das Bordteam entscheidet sich fuer kontrollierte Zurueckhaltung und wartet auf weitere eindeutige Hinweise
Die bekannte Spur wird verfolgt ohne einen direkten Kontakt oder eine Kursaenderung zu erzwingen
